android.useAndroidX=true
android.enableJetifier=true

# Kotlin Configuration
kotlin.incremental=true
kotlin.incremental.multiplatform=true

# KSP Configuration
ksp.incremental=true
ksp.incremental.log=false

# Gradle Configuration optimizado para Kotlin 2.0.x
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options="-Xmx2048m"

# Desactivar warnings de Kotlin
kotlin.suppressGradlePluginWarnings=true


