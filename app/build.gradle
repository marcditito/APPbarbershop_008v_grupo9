plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.devtools.ksp" version "2.0.21-1.0.27"
    id "kotlin-parcelize"
}

android {
    namespace "com.example.barbershopapp"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.barbershopapp"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
    }

    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    // Material Design
    implementation "com.google.android.material:material:1.12.0"

    // ConstraintLayout
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"

    // ViewModel y LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    // Room - Compatible con Kotlin 2.0.x
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    // Corrutinas - versión compatible
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"

    // Play Services Location
    implementation "com.google.android.gms:play-services-location:21.3.0"


    // RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Biometric Authentication
    implementation "androidx.biometric:biometric:1.2.0-alpha05"

    // Network - Retrofit, Moshi, Gson y OkHttp para Xano
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-moshi:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.moshi:moshi:1.15.0"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    ksp "com.squareup.moshi:moshi-kotlin-codegen:1.15.0"

    // Forzar versión de Kotlin stdlib compatible
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:2.0.21"
    }
}

